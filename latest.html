<head>

  <style>
    :root{
      --bg0:#07070a;
      --bg1:#0b0c10;
      --card: rgba(255,255,255,.06);
      --card2: rgba(255,255,255,.10);
      --text:#f3f4f6;
      --muted:#a7abb3;
      --shadow: 0 16px 50px rgba(0,0,0,.55);
      --ring: rgba(255,255,255,.18);
      --accent: rgba(255,255,255,.22);
      --radius: 18px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:
        radial-gradient(900px 500px at 18% 12%, rgba(255,255,255,.10), transparent 55%),
        radial-gradient(700px 450px at 90% 20%, rgba(255,255,255,.06), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      color: var(--text);
    }

    .wrap{
      max-width: 1020px;
      margin: 0 auto;
      padding: 22px 16px 64px;
    }

    header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .title{
      display:flex;
      flex-direction:column;
      gap: 8px;
      min-width: 0;
    }

    h1{
      margin:0;
      font-size: clamp(1.65rem, 2.6vw, 2.35rem);
      letter-spacing: .2px;
    }

    .sub{
      margin:0;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.35;
    }

    .chip{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.10);
      color: var(--muted);
      font-size: .92rem;
      white-space:nowrap;
    }

    .grid{
      margin-top: 16px;
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    @media (max-width: 900px){
      .grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px){
      header{ align-items:flex-start; flex-direction:column; }
      .chip{ width: fit-content; }
      .grid{ grid-template-columns: 1fr; gap: 12px; }
    }

    .tile{
      position: relative;
      border-radius: var(--radius);
      overflow:hidden;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      cursor: zoom-in;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .tile:focus-visible{
      box-shadow: 0 0 0 3px var(--ring), 0 16px 55px rgba(0,0,0,.55);
    }

    .tile img{
      width: 100%;
      height: 280px;
      object-fit: cover;
      display:block;
      transform: scale(1.01);
      transition: transform .25s ease, filter .25s ease;
    }

    @media (max-width: 520px){
      .tile img{ height: 320px; }
    }

    .tile:hover img{
      transform: scale(1.05);
      filter: brightness(1.03);
    }

    .badge{
      position:absolute;
      left: 12px;
      bottom: 12px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.45);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(10px);
      color: rgba(255,255,255,.92);
      font-size: .88rem;
      display:flex;
      align-items:center;
      gap: 8px;
      pointer-events:none;
    }

    /* Lightbox */
    .lightbox{
      position: fixed;
      inset: 0;
      display: none;
      align-items:center;
      justify-content:center;
      padding: 18px;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(6px);
      z-index: 9999;
    }
    .lightbox.open{ display:flex; }

    .lb-card{
      width: min(980px, 100%);
      max-height: 86vh;
      background: rgba(20,20,24,.75);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    .lb-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
    }

    .lb-title{
      color: rgba(255,255,255,.9);
      font-size: .95rem;
      overflow:hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 75%;
    }

    .lb-actions{
      display:flex;
      gap: 8px;
    }

    .btn{
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.92);
      padding: 8px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-size: .92rem;
      line-height: 1;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width: 40px;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover{ background: rgba(255,255,255,.12); }
    .btn:active{ transform: translateY(1px); }

    .lb-body{
      position: relative;
      padding: 0;
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,.35);
    }

    .lb-img{
      width: 100%;
      height: auto;
      max-height: calc(86vh - 56px);
      object-fit: contain;
      display:block;
    }

    .nav{
      position:absolute;
      top: 50%;
      transform: translateY(-50%);
      border-radius: 999px;
      width: 44px;
      height: 44px;
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.14);
      cursor:pointer;
      user-select:none;
    }
    .nav:hover{ background: rgba(255,255,255,.14); }
    .nav.prev{ left: 12px; }
    .nav.next{ right: 12px; }

    @media (max-width: 520px){
      .nav{ width: 40px; height: 40px; }
      .nav.prev{ left: 10px; }
      .nav.next{ right: 10px; }
    }

    /* Dump switcher */
    .dump-switcher{
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 6px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.10);
    }

    .sw-btn{
      font-family: inherit;
      font-size: .88rem;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: background .18s ease, color .18s ease, border-color .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .sw-btn:hover{ color: var(--text); background: rgba(255,255,255,.07); }
    .sw-btn.active{
      background: rgba(255,255,255,.10);
      border-color: rgba(255,255,255,.18);
      color: var(--text);
    }
    .sw-btn .new-badge{
      display: inline-block;
      font-size: .68rem;
      padding: 1px 5px;
      border-radius: 999px;
      background: rgba(255,255,255,.18);
      color: var(--text);
      margin-left: 4px;
      vertical-align: middle;
      letter-spacing: .3px;
    }

    /* Hidden pane */
    .dump-pane{ display: none; }
    .dump-pane.active{ display: contents; }
  </style>
</head>

<body>

        <button class="tile" type="button" data-src="/images/photo_07.jpeg" data-photo-id="photo_07" aria-label="Open Teddy photo 07">

        <button class="tile" type="button" data-src="/images/photo_08.jpeg" data-photo-id="photo_08" aria-label="Open Teddy photo 08">

        <button class="tile" type="button" data-src="/images/photo_10.jpeg" data-photo-id="photo_10" aria-label="Open Teddy photo 10">

      <!-- ── Dump 2 — add your photos here ── -->

        To populate Dump 2:

      <div class="dump-pane active" data-dump-id="2" id="dump2pane">

        <button class="tile" type="button" data-src="/images/dump2/photo_01.jpeg" data-photo-id="d2_photo_01" aria-label="Open Teddy photo 01">
          <img src="/images/dump2/photo_01.jpeg" alt="Teddy photo 01" loading="lazy" />

        <button class="tile" type="button" data-src="/images/dump2/photo_02.jpeg" data-photo-id="d2_photo_02" aria-label="Open Teddy photo 02">

        <button class="tile" type="button" data-src="/images/dump2/photo_03.jpeg" data-photo-id="d2_photo_03" aria-label="Open Teddy photo 03">

        <button class="tile" type="button" data-src="/images/dump2/photo_04.png" data-photo-id="d2_photo_04" aria-label="Open Teddy photo 04">

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lb-card" role="dialog" aria-modal="true" aria-label="Photo viewer">
      <div class="lb-top">
        <div class="lb-title" id="lbTitle">Photo</div>
        <div class="lb-actions">
          <button class="btn" id="lbClose" type="button" aria-label="Close">✕</button>
        </div>
      </div>

      <div class="lb-body" id="lbBody">
        <div class="nav prev" id="lbPrev" aria-label="Previous" title="Previous">‹</div>
        <img class="lb-img" id="lbImg" alt="" />
        <div class="nav next" id="lbNext" aria-label="Next" title="Next">›</div>
      </div>
    </div>
  </div>

  <script>
    // ── Dump switcher ──────────────────────────────────────────────
    const swBtns  = document.querySelectorAll('.sw-btn');
    const panes   = document.querySelectorAll('.dump-pane');
    const dumpSub = document.getElementById('dumpSub');
    let activeDump = '2';

    function switchDump(dumpId) {
      if (activeDump === dumpId) return;
      activeDump = dumpId;
      swBtns.forEach(b => b.classList.toggle('active', b.dataset.dump === dumpId));
      panes.forEach(p => p.classList.toggle('active', p.dataset.dumpId === dumpId));
      dumpSub.textContent = `Dump #${dumpId}`;
      if (window.posthog) posthog.capture('teddy_dump_switch', { to_dump: dumpId });
    }

    swBtns.forEach(b => b.addEventListener('click', () => switchDump(b.dataset.dump)));

    // ── Lightbox ───────────────────────────────────────────────────
    const lightbox = document.getElementById('lightbox');
    const lbImg    = document.getElementById('lbImg');
    const lbTitle  = document.getElementById('lbTitle');
    const lbClose  = document.getElementById('lbClose');
    const lbPrev   = document.getElementById('lbPrev');
    const lbNext   = document.getElementById('lbNext');

    let currentTiles = [];
    let currentIndex = 0;

    function getActiveTiles() {
      const pane = document.getElementById(`dump${activeDump}pane`);
      return pane ? Array.from(pane.querySelectorAll('.tile')) : [];
    }

    function openAt(i) {
      currentTiles = getActiveTiles();
      currentIndex = i;
      const t = currentTiles[currentIndex];
      const src = t.getAttribute('data-src');
      const photoId = t.getAttribute('data-photo-id') || `photo_${String(i+1).padStart(2,'0')}`;
      lbImg.src = src;
      lbImg.alt = t.querySelector('img')?.alt || photoId;
      lbTitle.textContent = `🐾 ${photoId}`;
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      if (window.posthog) {
        posthog.capture('teddy_photo_opened', { photo_id: photoId, src, dump_id: activeDump });
      }
    }

    function closeLb() {
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      lbImg.src = '';
    }

    function prev() { openAt((currentIndex - 1 + currentTiles.length) % currentTiles.length); }
    function next() { openAt((currentIndex + 1) % currentTiles.length); }

    // Delegated click — works for both dumps without re-binding
    document.getElementById('gallery').addEventListener('click', (e) => {
      const tile = e.target.closest('.tile');
      if (!tile) return;
      const tiles = getActiveTiles();
      const idx = tiles.indexOf(tile);
      if (idx !== -1) openAt(idx);
    });

    lbClose.addEventListener('click', closeLb);
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLb(); });
    lbPrev.addEventListener('click', (e) => { e.stopPropagation(); prev(); });
    lbNext.addEventListener('click', (e) => { e.stopPropagation(); next(); });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape')     closeLb();
      if (e.key === 'ArrowLeft')  prev();
      if (e.key === 'ArrowRight') next();
    });

    // Swipe support
    let touchX = null;
    const lbBody = document.getElementById('lbBody');
    lbBody.addEventListener('touchstart', (e) => { touchX = e.changedTouches[0].clientX; }, { passive: true });
    lbBody.addEventListener('touchend', (e) => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if (Math.abs(dx) < 40) return;
      if (dx > 0) prev(); else next();
    }, { passive: true });
  </script>
</body>
</html>
